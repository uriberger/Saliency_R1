### LASER Stage 1 -- ReVisual-R1's cold start, on Qwen3-VL-8B-Instruct.
#
# Mirrors CSfufu/Revisual-R1's cold_start/examples/train_full/revisual_cold_start.yaml.
# Differences from theirs are marked DEVIATION and there are four; everything else is
# their value.
#
# THE POINT OF THIS RUN is `new_special_tokens` + `resize_vocab` below. LASER's reward
# demands <think></think><answer></answer> with one \boxed{} inside, and
# Qwen3-VL-8B-Instruct scores format 0.000 -- zero <think> tags in 64 rollouts across four
# prompt placements (jobs 6722516, 6722589). The format is not promptable on this model;
# their config TEACHES it, as four added tokens. That is why Stage 1 is not optional here
# even though their README calls it optional.

### model
model_name_or_path: Qwen/Qwen3-VL-8B-Instruct   # DEVIATION 1: theirs is Qwen2.5-VL-3B-Instruct
                                                # (LASER itself cold-starts the 7B)

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: /home/uberger/scratch/research/LLaMA-Factory/examples/deepspeed/ds_z2_config.json

### the four tags, added to the vocabulary rather than asked for in a prompt
# Their yaml says `new_special_tokens`; this LLaMA-Factory renamed it to
# `add_special_tokens` and the old name is a hard parse error, not a warning
# ("Some keys are not used by the HfArgumentParser"). Same semantics: patcher.py:341
# does `tokenizer.add_tokens(..., special_tokens=True)`. Do NOT use `add_tokens` --
# that is the NON-special variant and would add them as ordinary vocabulary.
add_special_tokens: <think>,</think>,<answer>,</answer>
resize_vocab: true

### dataset
# DEVIATION 2: theirs is `GRAMMAR`, which is NOT RELEASED -- their repo says it "will
# open source the GRAMMAR dataset within the next two weeks" and has not, and nothing
# matching exists on the hub. This is 40K verified text-only reasoning traces from
# OpenR1-Math-220k, reformatted to the four-tag target by build_coldstart_data.py and
# checked against the fork's own format_reward before being written. Matched to GRAMMAR
# in modality (text-only), size (~40K) and shape (explicit reasoning paths); NOT matched
# in mixture -- GRAMMAR is described as "diverse", this is maths-weighted. See
# build_coldstart_data.py for why OpenThoughts, the more diverse candidate, was rejected
# (0 of 400 sampled rows carry a \boxed{} answer).
dataset: laser_coldstart_text
dataset_dir: /home/uberger/scratch/research/saliency_r1/cold_data/laser/coldstart
template: qwen3_vl_nothink   # DEVIATION 3: theirs is qwen2_vl, for a Qwen2.5 model.
                             # Same role: the non-reasoning template, so the literal
                             # <think> tags come from the TARGETS and are not injected
                             # twice by a thinking template.
cutoff_len: 32768
overwrite_cache: true
preprocessing_num_workers: 128

### output
output_dir: /home/uberger/scratch/research/saliency_r1/checkpoint/laser_coldstart_qwen3_vl_8b_revisual
logging_steps: 1
# DEVIATION 6: theirs is 150. Set to 50 after two interactive allocations expired
# mid-run and cost ~90 minutes each. 50 caps the loss at ~85 minutes.
#
# NOT LOWER, AND THE REASON IS I/O RATHER THAN DISK. A checkpoint here is 126 GB -- 109 GB
# of DeepSpeed optimizer state plus 17 GB of weights. At ~102 s/step, save_steps 10 would
# be a 126 GB write every ~17 minutes, plausibly 10-25% of wall clock spent checkpointing
# -- more time than the crashes it protects against. At 50 it is every ~85 minutes, which
# is noise.
#
# save_total_limit 10 -> ~1.26 TB retained (29 TB free, so space is fine). It prunes
# OLDEST first, so after ten new saves checkpoint-150 and then -300 disappear. -300 is the
# 0.96-epoch checkpoint the epoch-1 decision rests on; copy its weights aside (17 GB, not
# the full 126) before it is pruned.
save_steps: 50
save_total_limit: 10
# Resumability across the wall limit, as launch_coldstart_job.sh's autoresume expects:
# keep full trainer state and do not wipe the output dir.
save_only_model: false
save_strategy: 'steps'
plot_loss: true
overwrite_output_dir: false
report_to: none      # DEVIATION 4: theirs is wandb. No key on these nodes, and a blocked
                     # auth prompt on a batch node is an invisible hang.
run_name: laser_coldstart_qwen3_vl_8b_revisual

### train
# DEVIATION 5, and it changes no maths: theirs is 4 x 4. Global batch is identical at
# 1 x 16 x 8 GPUs = 128, so the optimizer sees exactly the same updates.
#
# MEASURED, not guessed. 2 x 8 OOMs on an 80 GB card, in the BACKWARD pass, trying to
# allocate 15.59 GiB in one go. That is the cross-entropy gradient over the logits:
#
#     2 samples x ~12.8K tokens x 152K vocab x 4 bytes (fp32) = 15.6 GiB
#
# which is the arithmetic to reach for whenever a large-vocab model OOMs at a size that
# looks absurd for an 8B. Note the fp32: the forward logits are bf16, the CE gradient is
# not, so the peak is twice what a bf16 estimate predicts -- that is the part I got wrong
# first time. per_device 1 halves it to ~7.8 GiB against ~21 GiB free.
#
# The real fix, if this is ever tight again, is `enable_liger_kernel: true` -- its fused
# linear cross-entropy never materialises the logits at all. It needs `liger-kernel`
# installed in sr1_coldstart (a GLOBAL change to a shared env, per CLAUDE.md) and its
# Qwen3-VL support is unverified, so it is not the first move.
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5      # their YAML. The paper's Table 5 says 2e-5; same paper-vs-code
                           # drift as LASER's own window size, and the code wins.

# STAYS AT 5 EVEN THOUGH THE FIRST RUN ONLY BUYS ONE EPOCH. This is the whole trick for
# being resumable: `lr_scheduler_type: cosine` anneals over `num_train_epochs`, so setting
# 1 here would drive the LR to ~0 by the end of epoch 1 and "continuing to 5" afterwards
# would be a DIFFERENT run with a fresh schedule, not a continuation. Leaving it at 5 and
# simply stopping early keeps the real schedule; launch_coldstart_job.sh detects the
# latest checkpoint and passes resume_from_checkpoint, which restores optimizer,
# scheduler and RNG state, so a relaunch picks up mid-cosine exactly where it left off.
#
#   40,000 samples / global batch 128  =  313 steps/epoch,  1,563 steps for all 5.
#   save_steps 150 (their value) puts checkpoints at 150, 300, 450, ...
#   checkpoint-300 is 0.96 of an epoch -- that is the one to judge.
#
# THE DECISION AFTER EPOCH 1: measure the format rate on checkpoint-300 with
#   python laser_prompt_probe.py --model <checkpoint-300> --variants
# If it is near 1.0 the LASER run is unblocked for a fifth of the spend, and the
# remaining four epochs are a fidelity choice rather than a requirement. If it is still
# low, four more epochs would not have fixed it either.
num_train_epochs: 5
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 1.0e-2
bf16: true
ddp_timeout: 540000000

### eval
val_size: 0
per_device_eval_batch_size: 4
eval_strategy: 'no'
eval_steps: 10000000
